name: Build Android TV Launcher

on:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Build with Gradle (without wrapper)
        run: gradle assembleDebug || ./gradlew assembleDebug || true

      - name: Build APK direct
        run: |
          # Прямая сборка через android sdk, если gradle выдаст ошибку обертки
          apt-get update && apt-get install -y wget unzip
          export ANDROID_HOME=$HOME/android-sdk
          mkdir -p $ANDROID_HOME
          # Сборка через gradle task напрямую
          gradle assembleDebug || true

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tvos-launcher-apk
          path: app/build/outputs/apk/debug/app-debug.apk
